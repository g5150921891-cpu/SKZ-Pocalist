<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKZ Pocalist</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #bbb;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px 16px 50px;
    }

    .status {
      background: white;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .status-number {
      font-size: 26px;
      font-weight: bold;
    }

    .search {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 15px;
    }

    .members {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 25px;
    }

    .member {
      border: 0;
      padding: 11px 5px;
      border-radius: 10px;
      background: white;
      cursor: pointer;
    }

    .member.active {
      background: #111;
      color: white;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .card {
      position: relative;
      background: white;
      border-radius: 15px;
      padding: 12px;
      cursor: pointer;
      border: 3px solid transparent;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .card.is-owned {
      border-color: #111;
    }

    .card-image {
      width: 100%;
      height: 230px;
      background: #eee;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
    }

    .card.is-owned .card-image {
      opacity: 0.7;
    }

    .card h3 {
      margin: 12px 3px 4px;
      font-size: 16px;
    }

    .card p {
      margin: 0 3px;
      color: #777;
      font-size: 13px;
    }

    .owned {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #111;
      color: white;
      padding: 6px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      display: none;
    }

    .card.is-owned .owned {
      display: block;
    }

    @media (max-width: 600px) {
      .members {
        grid-template-columns: repeat(3, 1fr);
      }

      .cards {
        gap: 10px;
      }

      .card {
        padding: 8px;
      }

      .card-image {
        height: 210px;
      }
    }
  </style>
</head>
